services:

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    command: >
      mlflow server
      --host 127.0.0.1
      --port 5001
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlruns

  sentiment-api:
    build: .

    ports:
      - "5000:5000"

    environment:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5001

    depends_on:
      - mlflow