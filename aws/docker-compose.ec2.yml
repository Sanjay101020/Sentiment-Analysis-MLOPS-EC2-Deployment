services:
  sentiment-mlops:
    image: "${ECR_REGISTRY}/${ECR_REPOSITORY:-sentiment-mlops}:${IMAGE_TAG:-latest}"
    container_name: sentiment-mlops
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "5000"

    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://127.0.0.1:5000/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
