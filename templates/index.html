<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Sentiment Analysis</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f4f6f8;
}

.container {
    width: 100%;
    max-width: 800px;
    padding: 20px;
}

.card {
    background: white;

    padding: 40px;

    border-radius: 18px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.10);
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

textarea {
    width: 100%;
    min-height: 180px;

    padding: 15px;

    border: 1px solid #ccc;
    border-radius: 10px;

    font-size: 16px;

    resize: vertical;
}

button {
    width: 100%;

    margin-top: 15px;

    padding: 14px;

    border: none;
    border-radius: 10px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.result {
    margin-top: 25px;

    padding: 20px;

    border-radius: 12px;

    background: #f1f3f5;
}

.result h2 {
    margin-bottom: 15px;
}

.result p {
    margin: 10px 0;
}

.prediction {
    font-weight: bold;
}

.error {
    margin-top: 20px;

    padding: 15px;

    border-radius: 10px;

    background: #f8d7da;

    color: #842029;
}

.footer {
    display: flex;

    justify-content: center;

    gap: 20px;

    margin-top: 30px;

    color: #777;

    font-size: 14px;
}

@media (max-width: 600px) {

    .card {
        padding: 25px;
    }

    h1 {
        font-size: 25px;
    }

}
    </style>    

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🎬 Movie Sentiment Analysis</h1>

            <p class="subtitle">
                TensorFlow + MLflow + Flask
            </p>

            <form
                action="/predict"
                method="POST"
            >

                <textarea
                    name="review"
                    placeholder="Enter your movie review..."
                    required
                >{{ review if review else "" }}</textarea>

                <button type="submit">
                    Analyze Sentiment
                </button>

            </form>


            {% if prediction %}

            <div class="result">

                <h2>Prediction Result</h2>

                <p>
                    <strong>Review:</strong>
                    {{ review }}
                </p>

                <p>
                    <strong>Prediction:</strong>

                    <span class="prediction">
                        {{ prediction }}
                    </span>
                </p>

                <p>
                    <strong>Confidence:</strong>
                    {{ confidence }}%
                </p>

            </div>

            {% endif %}


            {% if error %}

            <div class="error">

                {{ error }}

            </div>

            {% endif %}


            <div class="footer">

                <span>TensorFlow</span>
                <span>MLflow</span>
                <span>Flask</span>

            </div>

        </div>

    </div>

</body>

</html>
